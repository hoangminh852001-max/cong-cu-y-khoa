<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONG CU Y KHOA</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --note-bg: #fffbeb;
      --note-border: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-weight: 700; color: var(--primary); font-size: 16px; white-space: nowrap; }
    .tabs { display: flex; gap: 8px; height: 100%; }
    .tab-btn { background: none; border: none; border-bottom: 3px solid transparent; padding: 0 12px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .top-actions { display: flex; gap: 8px; }
    main { flex: 1; padding: 12px; overflow: hidden; display: flex; }
    .tab-panel { display: none; width: 100%; height: 100%; gap: 12px; }
    .tab-panel.active { display: flex; }
    .left-col { width: 320px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    .left-head { padding: 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .search-input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    .proto-list { list-style: none; flex: 1; overflow-y: auto; }
    .proto-item { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .proto-item:hover { background: #f8fafc; }
    .proto-item.active { background: #e0f2fe; border-left: 4px solid var(--primary); }
    .proto-title { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
    .proto-meta { font-size: 12px; color: var(--muted); }
    .right-col { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    .right-head { padding: 10px 16px; border-bottom: 1px solid var(--border); background: #f8fafc; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .right-title { font-size: 16px; font-weight: 700; }
    .btn-group { display: flex; gap: 8px; flex-shrink: 0; }
    .right-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .content-view { white-space: pre-wrap; line-height: 1.55; font-size: 14px; }
    .note-view { background: var(--note-bg); border-left: 4px solid var(--note-border); padding: 10px 12px; border-radius: 6px; white-space: pre-wrap; font-size: 13px; color: #78350f; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .field label { font-weight: 700; font-size: 13px; }
    .input, .textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    .textarea.main-area { height: 210px; resize: none; }
    .textarea.note-area { height: 75px; resize: none; }
    .btn { padding: 7px 12px; border-radius: 6px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 6px; text-align: center; padding: 16px; }
    .toast { position: fixed; right: 16px; bottom: 16px; background: #0f172a; color: #fff; padding: 9px 14px; border-radius: 6px; font-size: 13px; display: none; z-index: 999; }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="brand">CONG CU Y KHOA</div>
    <div class="tabs">
      <button type="button" class="tab-btn active" data-target="panel-protocol">Protocol phau thuat, thu thuat</button>
      <button type="button" class="tab-btn" data-target="panel-other">Cong cu ho tro 2</button>
    </div>
    <div class="top-actions">
      <button type="button" class="btn btn-outline" id="exportBtn">Xuat JSON</button>
      <button type="button" class="btn btn-outline" id="importBtn">Nhap JSON</button>
      <input type="file" id="importInput" accept=".json" style="display:none">
    </div>
  </header>

  <main>
    <section id="panel-protocol" class="tab-panel active">
      <div class="left-col">
        <div class="left-head">
          <button type="button" class="btn btn-primary" id="newBtn">+ Nhap protocol moi</button>
          <input type="text" class="search-input" id="searchBox" placeholder="Tim ten phau thuat, thu thuat...">
        </div>
        <ul class="proto-list" id="protoList"></ul>
      </div>
      <div class="right-col" id="rightCol"></div>
    </section>

    <section id="panel-other" class="tab-panel">
      <div class="right-col">
        <div class="empty">
          <strong>Khu vuc bo sung tab cong cu tiep theo</strong>
          <span>San sang tich hop cac cong cu ho tro lam sang khac.</span>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toastBox"></div>

  <script>
    (function () {
      var KEY = "cong_cu_y_khoa_protocols_v2";
      var items = [];
      var currentId = null;

      function esc(text) {
        return String(text == null ? "" : text)
          .replace(/&/g, "&")
          .replace(/</g, "<")
          .replace(/>/g, ">")
          .replace(/"/g, """)
          .replace(/'/g, "'");
      }

      function toast(msg) {
        var box = document.getElementById("toastBox");
        box.textContent = msg;
        box.className = "toast show";
        setTimeout(function () {
          box.className = "toast";
        }, 2200);
      }

      function save() {
        localStorage.setItem(KEY, JSON.stringify(items));
      }

      function load() {
        try {
          var raw = localStorage.getItem(KEY);
          var arr = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(arr)) arr = [];
          items = arr.map(function (x, i) {
            return {
              id: String(x && x.id ? x.id : ("id_" + Date.now() + "_" + i)),
              title: String(x && x.title ? x.title : ""),
              content: String(x && x.content ? x.content : ""),
              note: String(x && x.note ? x.note : ""),
              updated: String(x && x.updated ? x.updated : new Date().toLocaleString("vi-VN"))
            };
          });
        } catch (e) {
          items = [];
        }
      }

      function showEmpty() {
        document.getElementById("rightCol").innerHTML =
          '<div class="empty">' +
          '<strong>Chua chon protocol nao</strong>' +
          '<span>Bam "+ Nhap protocol moi" hoac chon 1 muc ben trai.</span>' +
          '</div>';
      }

      function renderList() {
        var ul = document.getElementById("protoList");
        var q = document.getElementById("searchBox").value.toLowerCase().trim();
        var filtered = items.filter(function (it) {
          return it.title.toLowerCase().indexOf(q) !== -1;
        });

        ul.innerHTML = "";
        if (filtered.length === 0) {
          ul.innerHTML = '<li style="padding:14px;color:#64748b;font-size:13px;">Chua co protocol nao.</li>';
          return;
        }

        filtered.forEach(function (it) {
          var li = document.createElement("li");
          li.className = "proto-item" + (it.id === currentId ? " active" : "");
          li.innerHTML =
            '<div class="proto-title">' + esc(it.title) + '</div>' +
            '<div class="proto-meta">' + (it.note ? "[Co ghi chu] " : "") + esc(it.updated) + '</div>';
          li.addEventListener("click", function () {
            showDetail(it.id);
          });
          ul.appendChild(li);
        });
      }

      function showDetail(id) {
        var found = items.find(function (it) { return it.id === id; });
        if (!found) {
          showEmpty();
          return;
        }
        currentId = found.id;
        renderList();

        var noteHtml = found.note
          ? '<div class="note-view"><strong>Ghi chu:</strong>\n' + esc(found.note) + '</div>'
          : '';

        document.getElementById("rightCol").innerHTML =
          '<div class="right-head">' +
          '<div class="right-title">' + esc(found.title) + '</div>' +
          '<div class="btn-group">' +
          '<button type="button" class="btn btn-outline" id="editBtn">Chinh sua</button>' +
          '<button type="button" class="btn btn-outline" id="copyBtn">Sao chep protocol</button>' +
          '<button type="button" class="btn btn-danger" id="delBtn">Xoa protocol</button>' +
          '</div>' +
          '</div>' +
          '<div class="right-body">' +
          '<div class="content-view">' + esc(found.content) + '</div>' +
          noteHtml +
          '</div>';

        document.getElementById("editBtn").addEventListener("click", function () {
          openEditor(found.id);
        });
        document.getElementById("copyBtn").addEventListener("click", function () {
          duplicateItem(found.id);
        });
        document.getElementById("delBtn").addEventListener("click", function () {
          removeItem(found.id);
        });
      }

      function openEditor(editId) {
        var editing = editId ? items.find(function (it) { return it.id === editId; }) : null;
        var data = editing || { title: "", content: "", note: "" };

        document.getElementById("rightCol").innerHTML =
          '<div class="right-head">' +
          '<div class="right-title">' + (editing ? "Chinh sua protocol" : "Nhap protocol moi") + '</div>' +
          '<div class="btn-group">' +
          '<button type="button" class="btn btn-outline" id="cancelBtn">Huy</button>' +
          '<button type="button" class="btn btn-success" id="saveBtn">Luu</button>' +
          '</div>' +
          '</div>' +
          '<div class="right-body">' +
          '<div class="field">' +
          '<label for="inTitle">Ten phau thuat, thu thuat</label>' +
          '<input type="text" class="input" id="inTitle" value="' + esc(data.title) + '">' +
          '</div>' +
          '<div class="field">' +
          '<label for="inContent">Noi dung protocol</label>' +
          '<textarea class="textarea main-area" id="inContent">' + esc(data.content) + '</textarea>' +
          '</div>' +
          '<div class="field">' +
          '<label for="inNote">Ghi chu</label>' +
          '<textarea class="textarea note-area" id="inNote">' + esc(data.note) + '</textarea>' +
          '</div>' +
          '</div>';

        document.getElementById("cancelBtn").addEventListener("click", function () {
          if (editing) showDetail(editing.id);
          else showEmpty();
        });

        document.getElementById("saveBtn").addEventListener("click", function () {
          var t = document.getElementById("inTitle").value.trim();
          var c = document.getElementById("inContent").value.trim();
          var n = document.getElementById("inNote").value.trim();
          if (!t || !c) {
            toast("Vui long nhap Ten va Noi dung protocol.");
            return;
          }
          var stamp = new Date().toLocaleString("vi-VN");
          if (editing) {
            editing.title = t;
            editing.content = c;
            editing.note = n;
            editing.updated = stamp;
            currentId = editing.id;
          } else {
            var created = {
              id: "p_" + Date.now(),
              title: t,
              content: c,
              note: n,
              updated: stamp
            };
            items.unshift(created);
            currentId = created.id;
          }
          save();
          renderList();
          showDetail(currentId);
          toast("Da luu protocol.");
        });

        document.getElementById("inTitle").focus();
      }

      function duplicateItem(id) {
        var found = items.find(function (it) { return it.id === id; });
        if (!found) return;
        var copy = {
          id: "p_" + Date.now(),
          title: found.title + " (Ban sao)",
          content: found.content,
          note: found.note,
          updated: new Date().toLocaleString("vi-VN")
        };
        items.unshift(copy);
        currentId = copy.id;
        save();
        renderList();
        showDetail(copy.id);
        toast("Da sao chep protocol.");
      }

      function removeItem(id) {
        if (!confirm("Xoa protocol nay?")) return;
        items = items.filter(function (it) { return it.id !== id; });
        save();
        if (currentId === id) {
          currentId = null;
          showEmpty();
        }
        renderList();
        toast("Da xoa protocol.");
      }

      document.querySelectorAll(".tab-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var target = btn.getAttribute("data-target");
          document.querySelectorAll(".tab-btn").forEach(function (b) {
            b.classList.toggle("active", b === btn);
          });
          document.querySelectorAll(".tab-panel").forEach(function (p) {
            p.classList.toggle("active", p.id === target);
          });
        });
      });

      document.getElementById("newBtn").addEventListener("click", function () {
        openEditor(null);
      });

      document.getElementById("searchBox").addEventListener("input", renderList);

      document.getElementById("exportBtn").addEventListener("click", function () {
        var blob = new Blob([JSON.stringify(items, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "protocols.json";
        a.click();
        URL.revokeObjectURL(url);
        toast("Da xuat file JSON.");
      });

      document.getElementById("importBtn").addEventListener("click", function () {
        document.getElementById("importInput").click();
      });

      document.getElementById("importInput").addEventListener("change", function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          try {
            var parsed = JSON.parse(ev.target.result);
            if (!Array.isArray(parsed)) {
              toast("File JSON khong hop le.");
              return;
            }
            localStorage.setItem(KEY, JSON.stringify(parsed));
            load();
            currentId = null;
            renderList();
            showEmpty();
            toast("Da nhap du lieu.");
          } catch (err) {
            toast("Loi doc file JSON.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      });

      load();
      renderList();
      showEmpty();
    })();
  </script>
</body>
</html>
