<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CÔNG CỤ Y KHOA</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --note-bg: #fffbeb;
            --note-border: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 54px;
            flex-shrink: 0;
            gap: 12px;
        }

        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            height: 100%;
        }

        .tab-btn {
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 0 14px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--primary);
            background-color: #f8fafc;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        main {
            flex: 1;
            padding: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tab-content {
            display: none;
            height: 100%;
            width: 100%;
        }

        .tab-content.active {
            display: flex;
            gap: 14px;
        }

        .sidebar-panel {
            width: 330px;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--primary);
        }

        .protocol-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .protocol-item {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }

        .protocol-item:hover {
            background-color: #f8fafc;
        }

        .protocol-item.active {
            background-color: #e0f2fe;
            border-left: 4px solid var(--primary);
        }

        .protocol-item-title {
            font-weight: 600;
            font-size: 0.94rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .protocol-item-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .detail-panel {
            flex: 1;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .detail-header {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8fafc;
            gap: 12px;
            flex-shrink: 0;
        }

        .detail-title {
            font-size: 1.12rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .action-group {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .detail-body {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            line-height: 1.6;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .protocol-content-display {
            white-space: pre-wrap;
            color: #1e293b;
        }

        .note-box {
            background-color: var(--note-bg);
            border-left: 4px solid var(--note-border);
            border-radius: 6px;
            padding: 12px 14px;
            color: #78350f;
            white-space: pre-wrap;
            font-size: 0.92rem;
        }

        .note-label {
            font-weight: 700;
            margin-bottom: 4px;
            display: block;
            color: #92400e;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.94rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        textarea.form-control.content-area {
            resize: none;
            height: 220px;
            line-height: 1.5;
        }

        textarea.form-control.note-area {
            resize: none;
            height: 80px;
            line-height: 1.45;
        }

        .btn {
            padding: 8px 13px;
            border-radius: 6px;
            border: none;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: white;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background-color: #f1f5f9;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-success:hover {
            opacity: 0.92;
        }

        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e293b;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .tab-content.active {
                flex-direction: column;
            }
            .sidebar-panel {
                width: 100%;
                height: 260px;
            }
            .detail-panel {
                min-height: 360px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span>⚕️ CÔNG CỤ Y KHOA</span>
        </div>

        <nav class="nav-tabs" id="navTabs">
            <button type="button" class="tab-btn active" data-tab="tab-protocol">
                📋 Protocol phẫu thuật, thủ thuật
            </button>
            <button type="button" class="tab-btn" data-tab="tab-future-1">
                🧮 Công cụ hỗ trợ 2 (Dự phòng)
            </button>
        </nav>

        <div class="header-actions">
            <button type="button" class="btn btn-outline" id="btnExport">⬇️ Xuất dữ liệu</button>
            <button type="button" class="btn btn-outline" id="btnImportTrigger">⬆️ Nhập dữ liệu</button>
            <input type="file" id="importFile" accept=".json" style="display: none;">
        </div>
    </header>

    <main>
        <section id="tab-protocol" class="tab-content active">
            <div class="sidebar-panel">
                <div class="sidebar-header">
                    <button type="button" class="btn btn-primary" style="width: 100%;" id="btnNewProtocol">
                        ➕ Nhập protocol mới
                    </button>
                    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Tìm tên phẫu thuật, thủ thuật...">
                </div>
                <ul id="protocolList" class="protocol-list"></ul>
            </div>

            <div class="detail-panel" id="detailPanel"></div>
        </section>

        <section id="tab-future-1" class="tab-content">
            <div class="detail-panel">
                <div class="empty-state">
                    <p style="font-size: 1.08rem; font-weight: 600;">Khu vực tích hợp công cụ tiếp theo</p>
                    <p style="font-size: 0.9rem;">Sẵn sàng bổ sung các tính năng lâm sàng khác tại đây.</p>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        (function () {
            const STORAGE_KEY = 'medical_protocols_v1';

            const defaultProtocols = [
                {
                    id: 'demo-1',
                    title: 'Gây tê tủy sống phẫu thuật kết hợp xương chi dưới',
                    content: '1. Chuẩn bị bệnh nhân:\n- Đánh giá tiền mê, kiểm tra đông máu (PT, aPTT, Tiểu cầu).\n- Lập đường truyền tĩnh mạch ngoại biên kim 18G, truyền dịch tinh thể 500ml.\n\n2. Kỹ thuật:\n- Tư thế: Nằm nghiêng hoặc ngồi cong lưng tôm.\n- Vị trí chọc: Khe liên đốt L3-L4 hoặc L4-L5.\n- Thuốc tê: Bupivacaine heavy 0.5% liều 7.5 - 10mg phối hợp Morphine 0.1mg.',
                    note: 'Theo dõi sát huyết áp và nhịp thở trong 24 giờ đầu nếu có phối hợp Morphine tủy sống.',
                    updatedAt: new Date().toLocaleString('vi-VN')
                }
            ];

            function escapeHTML(str) {
                return String(str ?? '').replace(/[&<>'"]/g, function (tag) {
                    const map = {
                        '&': '&',
                        '<': '<',
                        '>': '>',
                        "'": ''',
                        '"': '"'
                    };
                    return map[tag] || tag;
                });
            }

            function normalizeItem(item, idx) {
                const obj = item && typeof item === 'object' ? item : {};
                return {
                    id: String(obj.id || ('proto-' + Date.now() + '-' + idx)),
                    title: String(obj.title || 'Chưa có tên'),
                    content: String(obj.content || ''),
                    note: String(obj.note || ''),
                    updatedAt: String(obj.updatedAt || new Date().toLocaleString('vi-VN'))
                };
            }

            function loadProtocols() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return defaultProtocols.map(normalizeItem);
                    const parsed = JSON.parse(raw);
                    if (!Array.isArray(parsed)) return defaultProtocols.map(normalizeItem);
                    return parsed.map(normalizeItem);
                } catch (err) {
                    return defaultProtocols.map(normalizeItem);
                }
            }

            let protocols = loadProtocols();
            let selectedId = null;

            function saveToStorage() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(protocols));
            }

            function showToast(msg) {
                const toast = document.getElementById('toast');
                if (!toast) return;
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(function () {
                    toast.classList.remove('show');
                }, 2600);
            }

            function switchTab(tabId) {
                document.querySelectorAll('.tab-content').forEach(function (sec) {
                    sec.classList.toggle('active', sec.id === tabId);
                });
                document.querySelectorAll('.tab-btn').forEach(function (btn) {
                    btn.classList.toggle('active', btn.dataset.tab === tabId);
                });
            }

            function resetDetailPanel() {
                const panel = document.getElementById('detailPanel');
                panel.innerHTML = [
                    '<div class="empty-state">',
                    '  <p style="font-size: 1.08rem; font-weight: 600; margin-bottom: 6px;">Chưa chọn Protocol nào</p>',
                    '  <p style="font-size: 0.9rem;">Chọn một phẫu thuật/thủ thuật ở danh sách bên trái để xem hoặc bấm <b>"Nhập protocol mới"</b>.</p>',
                    '</div>'
                ].join('');
            }

            function renderList() {
                const listEl = document.getElementById('protocolList');
                const searchEl = document.getElementById('searchInput');
                const keyword = (searchEl ? searchEl.value : '').toLowerCase().trim();

                const filtered = protocols.filter(function (p) {
                    return String(p.title || '').toLowerCase().includes(keyword);
                });

                listEl.innerHTML = '';

                if (filtered.length === 0) {
                    listEl.innerHTML = '<li style="padding: 20px; text-align: center; color: #64748b; font-size: 0.9rem;">Không tìm thấy protocol nào</li>';
                    return;
                }

                filtered.forEach(function (item) {
                    const li = document.createElement('li');
                    li.className = 'protocol-item' + (item.id === selectedId ? ' active' : '');
                    li.dataset.id = item.id;

                    const notePrefix = item.note && item.note.trim() !== '' ? '📝 Có ghi chú • ' : '';
                    li.innerHTML = [
                        '<div class="protocol-item-title">' + escapeHTML(item.title) + '</div>',
                        '<div class="protocol-item-meta">' + notePrefix + 'Cập nhật: ' + escapeHTML(item.updatedAt) + '</div>'
                    ].join('');

                    li.addEventListener('click', function () {
                        viewProtocol(item.id);
                    });

                    listEl.appendChild(li);
                });
            }

            function viewProtocol(id) {
                const item = protocols.find(function (p) {
                    return p.id === id;
                });

                if (!item) {
                    resetDetailPanel();
                    return;
                }

                selectedId = item.id;
                renderList();

                const noteHtml = item.note && item.note.trim() !== ''
                    ? '<div class="note-box"><span class="note-label">📌 Ghi chú</span>' + escapeHTML(item.note) + '</div>'
                    : '';

                const panel = document.getElementById('detailPanel');
                panel.innerHTML = [
                    '<div class="detail-header">',
                    '  <div class="detail-title">' + escapeHTML(item.title) + '</div>',
                    '  <div class="action-group">',
                    '    <button type="button" class="btn btn-outline" id="btnEditProto">✏️ Chỉnh sửa</button>',
                    '    <button type="button" class="btn btn-outline" id="btnCopyProto">📋 Sao chép protocol</button>',
                    '    <button type="button" class="btn btn-danger" id="btnDeleteProto">🗑️ Xóa protocol</button>',
                    '  </div>',
                    '</div>',
                    '<div class="detail-body">',
                    '  <div class="protocol-content-display">' + escapeHTML(item.content) + '</div>',
                    noteHtml,
                    '</div>'
                ].join('');

                document.getElementById('btnEditProto').addEventListener('click', function () {
                    openForm(item.id);
                });

                document.getElementById('btnCopyProto').addEventListener('click', function () {
                    copyProtocol(item.id);
                });

                document.getElementById('btnDeleteProto').addEventListener('click', function () {
                    deleteProtocol(item.id);
                });
            }

            function openForm(editId) {
                const isEdit = Boolean(editId);
                const found = isEdit
                    ? protocols.find(function (p) { return p.id === editId; })
                    : null;

                const current = found || { title: '', content: '', note: '' };
                const panel = document.getElementById('detailPanel');

                panel.innerHTML = [
                    '<div class="detail-header">',
                    '  <div class="detail-title">' + (isEdit ? 'Chỉnh sửa Protocol' : 'Nhập Protocol mới') + '</div>',
                    '  <div class="action-group">',
                    '    <button type="button" class="btn btn-outline" id="btnCancelForm">Hủy</button>',
                    '    <button type="button" class="btn btn-success" id="btnSaveForm">💾 Lưu</button>',
                    '  </div>',
                    '</div>',
                    '<div class="detail-body">',
                    '  <div class="form-group">',
                    '    <label for="protoTitle">Tên phẫu thuật, thủ thuật <span style="color:red">*</span></label>',
                    '    <input type="text" id="protoTitle" class="form-control" placeholder="Ví dụ: Phẫu thuật nội soi cắt ruột thừa..." value="' + escapeHTML(current.title) + '">',
                    '  </div>',
                    '  <div class="form-group">',
                    '    <label for="protoContent">Nội dung protocol <span style="color:red">*</span></label>',
                    '    <textarea id="protoContent" class="form-control content-area" placeholder="Nhập các bước chuẩn bị, quy trình thực hiện, thuốc, theo dõi...">' + escapeHTML(current.content) + '</textarea>',
                    '  </div>',
                    '  <div class="form-group">',
                    '    <label for="protoNote">Ghi chú</label>',
                    '    <textarea id="protoNote" class="form-control note-area" placeholder="Nhập ghi chú bổ sung, lưu ý đặc biệt (không bắt buộc)...">' + escapeHTML(current.note) + '</textarea>',
                    '  </div>',
                    '</div>'
                ].join('');

                document.getElementById('btnCancelForm').addEventListener('click', function () {
                    if (isEdit && found) {
                        viewProtocol(found.id);
                    } else {
                        resetDetailPanel();
                    }
                });

                document.getElementById('btnSaveForm').addEventListener('click', function () {
                    saveProtocol(isEdit ? editId : null);
                });

                const titleInput = document.getElementById('protoTitle');
                if (titleInput) titleInput.focus();
            }

            function saveProtocol(editId) {
                const titleInput = document.getElementById('protoTitle');
                const contentInput = document.getElementById('protoContent');
                const noteInput = document.getElementById('protoNote');

                const title = (titleInput ? titleInput.value : '').trim();
                const content = (contentInput ? contentInput.value : '').trim();
                const note = (noteInput ? noteInput.value : '').trim();

                if (!title || !content) {
                    showToast('⚠️ Vui lòng nhập đầy đủ Tên và Nội dung protocol!');
                    return;
                }

                const now = new Date().toLocaleString('vi-VN');

                if (editId) {
                    const idx = protocols.findIndex(function (p) { return p.id === editId; });
                    if (idx !== -1) {
                        protocols[idx] = {
                            id: protocols[idx].id,
                            title: title,
                            content: content,
                            note: note,
                            updatedAt: now
                        };
                        selectedId = protocols[idx].id;
                        saveToStorage();
                        renderList();
                        viewProtocol(selectedId);
                        showToast('✅ Đã cập nhật protocol!');
                    }
                } else {
                    const newItem = {
                        id: 'proto-' + Date.now(),
                        title: title,
                        content: content,
                        note: note,
                        updatedAt: now
                    };
                    protocols.unshift(newItem);
                    selectedId = newItem.id;
                    saveToStorage();
                    renderList();
                    viewProtocol(selectedId);
                    showToast('✅ Đã lưu protocol mới!');
                }
            }

            function copyProtocol(id) {
                const item = protocols.find(function (p) { return p.id === id; });
                if (!item) return;

                const noteText = item.note && item.note.trim() !== '' ? '\n\nGhi chú:\n' + item.note : '';
                const clipboardText = String(item.title).toUpperCase() + '\n\n' + item.content + noteText;

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(clipboardText).catch(function () {});
                }

                const duplicated = {
                    id: 'proto-' + Date.now(),
                    title: item.title + ' (Bản sao)',
                    content: item.content,
                    note: item.note || '',
                    updatedAt: new Date().toLocaleString('vi-VN')
                };

                protocols.unshift(duplicated);
                selectedId = duplicated.id;
                saveToStorage();
                renderList();
                viewProtocol(selectedId);
                showToast('📋 Đã tạo bản sao & chép nội dung vào bộ nhớ tạm!');
            }

            function deleteProtocol(id) {
                if (!window.confirm('Bạn có chắc chắn muốn xóa protocol này không?')) return;
                protocols = protocols.filter(function (p) { return p.id !== id; });
                saveToStorage();
                if (selectedId === id) {
                    selectedId = null;
                    resetDetailPanel();
                }
                renderList();
                showToast('🗑️ Đã xóa protocol!');
            }

            function exportData() {
                const jsonText = JSON.stringify(protocols, null, 2);
                const blob = new Blob([jsonText], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'protocol_ykhoa_' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('⬇️ Đã xuất file dữ liệu dự phòng!');
            }

            function importData(event) {
                const file = event.target.files && event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (!Array.isArray(parsed)) {
                            window.alert('File không đúng định dạng danh sách protocol!');
                            return;
                        }
                        protocols = parsed.map(normalizeItem);
                        selectedId = null;
                        saveToStorage();
                        renderList();
                        resetDetailPanel();
                        showToast('✅ Đã nhập dữ liệu thành công!');
                    } catch (err) {
                        window.alert('Lỗi đọc file JSON!');
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            }

            document.querySelectorAll('.tab-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    switchTab(btn.dataset.tab);
                });
            });

            document.getElementById('btnNewProtocol').addEventListener('click', function () {
                openForm(null);
            });

            document.getElementById('searchInput').addEventListener('input', renderList);
            document.getElementById('btnExport').addEventListener('click', exportData);
            document.getElementById('btnImportTrigger').addEventListener('click', function () {
                document.getElementById('importFile').click();
            });
            document.getElementById('importFile').addEventListener('change', importData);

            renderList();
            resetDetailPanel();
        })();
    </script>
</body>
</html>
